name: CI

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mra_test
          POSTGRES_USER: mra
          POSTGRES_PASSWORD: mra_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mra -d mra_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://mra:mra_test_password@localhost:5432/mra_test
      TEST_DATABASE_URL: postgresql+psycopg://mra:mra_test_password@localhost:5432/mra_test
      CORS_ORIGINS: http://localhost:5173
    defaults:
      run:
        working-directory: apps/mra-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: apps/mra-api/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: alembic upgrade head
      - run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: corepack enable
      - run: corepack prepare pnpm@10.15.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:studio
      - run: pnpm build:studio
